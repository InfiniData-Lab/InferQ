# Dataset registry.
#
# Nothing here is vendored into the repository. Each entry names an
# immutable upstream, an ordered list of mirrors to try, and a sha256 for
# every file the loaders will read. `inferq data fetch <key>` downloads and
# unpacks into $INFERQ_DATA_DIR (see inferq.paths); `inferq data verify
# <key>` re-hashes what is on disk against this file.
#
# A committed per-file checksum is strictly more reproducible than the
# vendored copy this replaces: that copy recorded an upstream commit SHA but
# carried no checksums, so nothing could confirm the bytes matched it.

version = 1

[datasets.qasmbench]
description = "QASMBench small + medium tiers (Li et al., NPJ QI 2022)."
homepage = "https://github.com/pnnl/QASMBench"
license = "BSD-3-Clause"
citation = "Li et al., QASMBench: A Low-Level QASM Benchmark Suite for NISQ Evaluation and Simulation, ACM TQC 2023"

# The upstream commit the checksums below were taken from. GitHub serves a
# byte-stable tarball for a commit SHA, so this is the primary source and
# needs no mirror of ours to stay reproducible.
upstream = "https://github.com/pnnl/QASMBench.git"
commit = "357b942396d5c2b7cbc1c229c585a6ef5ccaebac"
mirrors = [
    "https://codeload.github.com/pnnl/QASMBench/tar.gz/357b942396d5c2b7cbc1c229c585a6ef5ccaebac",
]

# Paths are relative to the dataset root and to the tarball's top-level
# directory alike; the fetcher strips the leading component.
strip_components = 1
subdirs = ["small", "medium"]

# The largest file is 81 MB for 14 qubits, which passes the default qubit
# filter and would otherwise be handed to the QASM parser on every ingest.
max_file_bytes = 8_000_000

