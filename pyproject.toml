[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "inferq"
version = "0.1.0"
description = "Generation, simulation, and feature extraction for quantum-circuit benchmark datasets."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.14"
authors = [{ name = "InfiniData Lab" }]
keywords = ["quantum", "qiskit", "benchmark", "simulation", "database"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]

# Abstract runtime requirements only: every distribution listed here is imported
# by a module under src/inferq that is reachable without an extra. Version
# ranges, not pins -- a library that pins its dependencies cannot be installed
# alongside anything else. The exact versions used for the paper live in
# uv.lock.
dependencies = [
    "networkx>=3.4",
    "numpy>=2.2,<3",
    "psutil>=7",
    "python-dotenv>=1.1",
    "qiskit>=2.0,<3",
    "qiskit-aer>=0.17",
    "rustworkx>=0.16",
    "sqlglot>=28.5",
    "tqdm>=4.67",
]

[project.optional-dependencies]
# Bulk metadata transfer: the parquet export and import paths in
# `inferq.transfer`, which are provider-neutral and therefore shared by every
# cloud backend rather than owned by one of them.
cloud = [
    "pandas>=2.2",
    "pyarrow>=20",
]
# Azure Blob + Table storage backend for `inferq.remote`.
azure = [
    "inferq[cloud]",
    "azure-data-tables>=12.7",
    "azure-identity>=1.23",
    "azure-storage-blob>=12.25",
]
# AWS S3 + DynamoDB storage backend for `inferq.remote`.
aws = [
    "inferq[cloud]",
    "boto3>=1.35",
    "botocore>=1.35",
]
# Third-party circuit corpora loaded by `inferq.datasets`.
datasets = [
    "mqt-bench>=2.2",
    "supermarq>=0.5",
]
# Relational back ends for the SQL simulation path and the smoke test. The
# tensor-network-to-SQL lowering itself comes from InfiniQuantumSim, which is
# not on PyPI; see the `infiniquantum` dependency group below.
sql = [
    "duckdb>=1.1",
    "opt-einsum>=3.3",
    "psycopg2-binary>=2.9",
]
all = [
    "inferq[aws,azure,cloud,datasets,sql]",
]

[project.scripts]
inferq = "inferq.cli:main"

[project.urls]
Homepage = "https://github.com/InfiniData-Lab/InferQ"
Repository = "https://github.com/InfiniData-Lab/InferQ"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
# InfiniQuantumSim is a git dependency. PyPI rejects any distribution whose
# Requires-Dist carries a direct URL -- extras included -- so it can never be a
# `[project.optional-dependencies]` entry without blocking every release. As a
# PEP 735 group resolved through [tool.uv.sources] it is lockfile-local and
# never reaches the wheel. Install with `uv sync --group infiniquantum`.
infiniquantum = ["infiniquantumsim"]

[tool.uv]
default-groups = ["dev"]

[tool.uv.workspace]
members = ["experiments"]

[tool.uv.sources]
infiniquantumsim = { git = "https://github.com/InfiniData-Lab/Quantum.git", branch = "inferq" }
inferq = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/inferq"]

[tool.hatch.build.targets.sdist]
# The sdist is the source of the wheel plus what is needed to verify it. It is
# deliberately not the whole checkout: experiments/, docs/ and the generated
# trees are research output, not distribution content.
include = [
    "/src",
    "/tests",
    "/tools",
    "/README.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `experiments` is a virtual workspace member: uv installs its dependencies but
# not the package, so the repository root has to be on the import path for the
# import-integrity test to reach it.
pythonpath = ["."]
# Collection stays inside tests/: several modules under experiments/ and
# tools/ are named test_* but are live-service probes, not unit tests.
norecursedirs = ["build", "data", "docs", "experiments", "out", "var", ".venv"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["build", "data", "docs", "out", "var", "*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["inferq", "experiments"]

[tool.ruff.lint.per-file-ignores]
# Lazy packages: every name is re-exported through a PEP 562 `__getattr__`, and
# the `if TYPE_CHECKING` block exists purely so type checkers and IDEs still see
# the public surface. `__all__` is computed from the export table, so ruff
# cannot tell those imports are the contract rather than dead weight.
"src/inferq/__init__.py" = ["F401"]
"src/inferq/datasets/__init__.py" = ["F401"]
"src/inferq/simulation/__init__.py" = ["F401"]

# Plotting and analysis scripts. These are frozen research code: they produced
# numbers that are in the paper, so reformatting them buys nothing and risks a
# figure changing. Lint them for real defects, not for house style.
"experiments/analysis/*.py" = ["B905", "E402", "E701", "E702", "F403", "F405"]
"experiments/analysis/**/*.py" = ["B905", "E402", "E701", "E702", "F403", "F405"]
